[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stdout_logfile=/app/logs/sshd.log
stderr_logfile=/app/logs/sshd.log

[program:postgresql]
command=/usr/lib/postgresql/13/bin/postgres -D /var/lib/postgresql/13/main -c config_file=/etc/postgresql/13/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
stdout_logfile=/app/logs/postgresql.log
stderr_logfile=/app/logs/postgresql.log

[program:doris-fe]
command=/opt/doris/fe/bin/start_fe.sh --daemon
directory=/opt/doris/fe
autostart=true
autorestart=true
stdout_logfile=/app/logs/doris-fe.log
stderr_logfile=/app/logs/doris-fe.log

[program:doris-be]
command=/opt/doris/be/bin/start_be.sh --daemon
directory=/opt/doris/be
autostart=true
autorestart=true
stdout_logfile=/app/logs/doris-be.log
stderr_logfile=/app/logs/doris-be.log

[program:grafana]
command=/usr/sbin/grafana-server --config=/etc/grafana/grafana.ini --pidfile=/var/run/grafana/grafana-server.pid --packaging=deb cfg:default.paths.logs=/var/log/grafana cfg:default.paths.data=/var/lib/grafana cfg:default.paths.plugins=/var/lib/grafana/plugins cfg:default.paths.provisioning=/etc/grafana/provisioning
autostart=true
autorestart=true
stdout_logfile=/app/logs/grafana.log
stderr_logfile=/app/logs/grafana.log

[program:init-services]
command=/app/scripts/init-services.sh
autostart=true
autorestart=false
stdout_logfile=/app/logs/init-services.log
stderr_logfile=/app/logs/init-services.log